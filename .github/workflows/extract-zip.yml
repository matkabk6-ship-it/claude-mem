name: Extract ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/extracted
          unzip -q claude-mem-main.zip -d /tmp/extracted
          if [ -d /tmp/extracted/claude-mem-main ]; then
            cp -a /tmp/extracted/claude-mem-main/. .
          else
            cp -a /tmp/extracted/. .
          fi
          rm -rf /tmp/extracted

      - name: Remove workflow files from extracted tree
        run: rm -rf .github/workflows

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract claude-mem-main.zip"
            git push
          fi
